name: Validate Pull Request

on:
  pull_request:
    branches: [develop, test, release, main]
    paths:
      - 'force-app/**'

jobs:
  validate:

    uses: ./.github/workflows/salesforce-ci-engine.yml

    with:
      deploy_mode: validate
      run_pmd: true
      environment_name: ${{ github.base_ref == 'develop' && 'CIT' || github.base_ref == 'test' && 'SIT' || startsWith(github.base_ref,'release/') && 'UAT' || github.base_ref == 'main' && 'Production' }}