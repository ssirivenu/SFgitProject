name: Salesforce Validation (No Container, Tarball CLI)

on:
  pull_request:
    branches: [develop, test, release, master]

jobs:
  validate-dev:
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.base_ref == 'main' && 'production' || github.base_ref == 'develop' && 'Test' || startsWith(github.base_ref, 'refs/heads/release/') && 'staging' }}

    env:
      SF_INSTALL_PLUGIN_SKIP_PROMPT: true
      SF_DISABLE_AUTOUPDATE: true
      SF_HIDE_RELEASE_NOTES: true

      SFDX_URL: ${{ secrets.SFDX_URL }}
      API_VERSION: ${{ vars.API_VERSION }}
      FROM_TAG: ${{ vars.FROM_TAG }}
      TO_TAG: ${{ vars.TO_TAG }}
      SANDBOX_NAME: ${{ vars.SANDBOX_NAME }}
      RUNAGAINSTORG: ${{ vars.RUNAGAINSTORG }}
      UNITTESTS_SCOPE: ${{ vars.UNITTESTS_SCOPE }}
      SPECIFIEDTESTS: ${{ vars.SPECIFIEDTESTS }}
      INSTANCE_URL: ${{ vars.INSTANCE_URL }}
      CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
      AESKEY: ${{ secrets.AESKEY }}
      IVKEY: ${{ secrets.IVKEY }}
      ENCRIPTED_KEY: ${{ secrets.ENCRIPTED_KEY }}
      USER_NAME: ${{ secrets.USER_NAME }}

    steps:

      # 1️⃣ Checkout source
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Cache Salesforce CLI (optional, speeds up repeated runs)
      - name: Cache Salesforce CLI
        uses: actions/cache@v3
        with:
          path: ~/sf
          key: sf-cli-${{ runner.os }}-${{ hashFiles('scripts/**') }}
          restore-keys: |
            sf-cli-

      # 3️⃣ Install Salesforce CLI (if cache miss)
      - name: Install Salesforce CLI
        run: |
          mkdir -p ~/sf
          wget https://developer.salesforce.com/media/salesforce-cli/sf/channels/stable/sf-linux-x64.tar.xz -O sf.tar.xz
          tar xJf sf.tar.xz -C ~/sf --strip-components 1
          export PATH="$HOME/sf/bin:$PATH"
          echo "$HOME/sf/bin" >> $GITHUB_PATH
          # Now sf works immediately
          sf --version

      # 4️⃣ Verify Salesforce CLI
      - name: Verify Salesforce CLI
        run: sf --version

      # 5️⃣ Install sfdx-git-delta plugin (non-interactive)
      - name: Install sfdx-git-delta plugin (non-interactive)
        run: echoy| sf plugins install sfdx-git-delta@6.31.0 --force

      # 6️⃣ Authorize Org
      - name: Authorize Org
        run: bash scripts/pipelines/AuthorizeOrg.sh

      # 7️⃣ Generate Delta
      - name: Generate Delta
        run: |
          mkdir -p delta
          sf sgd source delta \
            --to HEAD \
            --from $FROM_TAG \
            --output delta \
            --generate-delta

      # 8️⃣ Detect Apex Changes
      - name: Detect Apex Changes
        id: apex_check
        run: |
          if grep -R ".cls\|.trigger" delta; then
            echo "apex_changed=true" >> $GITHUB_OUTPUT
          else
            echo "apex_changed=false" >> $GITHUB_OUTPUT

      # 9️⃣ Set Test Level
      - name: Set Test Level
        id: testlevel
        run: |
          if [ "${{ steps.apex_check.outputs.apex_changed }}" = "true" ]; then
            echo "testlevel=RunLocalTests" >> $GITHUB_OUTPUT
          else
            echo "testlevel=NoTestRun" >> $GITHUB_OUTPUT

      # 🔟 Validate Deployment (dry-run)
      - name: Validate Deployment
        run: |
          sf project deploy start \
            --manifest delta/package/package.xml \
            --post-destructive-changes delta/destructiveChanges/destructiveChanges.xml \
            --target-org $SANDBOX_NAME \
            --test-level ${{ steps.testlevel.outputs.testlevel }} \
            --dry-run \
            --wait 30