name: Salesforce CI Engine

on:
  workflow_call:
    inputs:
      deploy_mode:
        required: true
        type: string
      run_pmd:
        required: true
        type: boolean
      environment_name:
        required: true
        type: string
      specified_tests:
        required: false
        type: string

jobs:
  salesforcePipeline:

    runs-on: ubuntu-latest

    # GITHUB_TOKEN Permissions
    permissions:
      contents: read

    #Environment to run against 
    environment:
      name: ${{ inputs.environment_name }}
    env:
      SFDX_URL: ${{ secrets.SFDX_URL }}
      API_VERSION: ${{ vars.API_VERSION }}
      FROM_TAG: ${{ vars.FROM_TAG }}
      TO_TAG: ${{ vars.TO_TAG }}
      SANDBOX_NAME: ${{ vars.SANDBOX_NAME }}
      RUNAGAINSTORG: ${{ vars.RUNAGAINSTORG }}
      UNITTESTS_SCOPE: ${{ vars.UNITTESTS_SCOPE }}
      SPECIFIEDTESTS: ${{ inputs.specified_tests || vars.SPECIFIEDTESTS || '' }}
      INSTANCE_URL: ${{vars.INSTANCE_URL}}
      USER_NAME: ${{secrets.USER_NAME}}
      CONSUMER_KEY: ${{secrets.CONSUMER_KEY}}
      SF_CLI_URL: ${{vars.SF_CLI_URL}}
      AESKEY: ${{secrets.AESKEY}}
      IVKEY: ${{secrets.AESKEY}}
      ENCRIPTED_KEY: ${{secrets.ENCRIPTED_KEY}}


    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cache Salesforce CLI plugins
      - name: Cache Salesforce plugins
        uses: actions/cache@v4
        with:
          path: ~/.sf
          key: sf-cli-${{ runner.os }}

      # Download and install Salesforce CLI with error handling
      - name: Install Salesforce CLI
        run: |
          set -e
          echo "📥 Downloading Salesforce CLI..."
          echo "Using Salesforce CLI URL: $SF_CLI_URL"
          mkdir -p ~/cli/sf
          curl -sL $SF_CLI_URL | tar xzC ~/cli/sf --strip-components 1
          echo "$HOME/cli/sf/bin" >> $GITHUB_PATH
          echo "✅ Salesforce CLI installed successfully"
      - name: Verify Salesforce CLI
        run: sf --version
      - name: Install sfdx-git-delta
        run: |
          echo y | sf plugins:install sfdx-git-delta
          sf plugins
      - name: Create Delta files
        run: |
          bash scripts/pipelines/CreateDeltaFiles.sh

      # Setup PMD
      - name: Setup PMD
        if: inputs.run_pmd == true
        uses: legetz/setup-pmd@7.0.0-rc4

      # Run PMD scan
      - name: Apex changes scan
        if: inputs.run_pmd == true && hashFiles('changedSources/force-app/main/default/classes/**/*.cls') != ''
        id: Codescan
        run: |
          mkdir -p pmdResults
          echo "🔍 Running PMD scan on Apex classes..."

          set +e
          pmd check \
            --dir changedSources/force-app/main/default/classes \
            --rulesets ./pmd-rules.xml \
            --format text \
            --report-file ./pmdResults/PmdResults.txt

          PMD_EXIT_CODE=$?
          set -e

          if [[ -s ./pmdResults/PmdResults.txt ]]; then
            cat ./pmdResults/PmdResults.txt
            exit $PMD_EXIT_CODE
          else
            echo "✅ No PMD violations found"
          fi

      - name: Upload PMD artifact
        if: failure() && steps.Codescan.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: Pmd-Scan-Report
          path: ./pmdResults/PmdResults.txt

      - name: Report PMD failure
        if: failure() && steps.Codescan.outcome == 'failure'
        run: |
          echo "❌ Apex classes failed PMD scan" >> $GITHUB_STEP_SUMMARY

      - name: No apex code scan
        if: inputs.run_pmd == true && hashFiles('changedSources/force-app/main/default/classes/**/*.cls') == ''
        run: |
          echo "ℹ️ No Apex class changes identified — PMD scan not run" >> $GITHUB_STEP_SUMMARY

      - name: Authorize Org
        run: |
          bash scripts/pipelines/AuthorizeOrg.sh

      - name: Deploy or Validate
        run: |
          bash scripts/pipelines/DeployOrValidateToOrg.sh ${{ inputs.deploy_mode }}

      - name: Success summary
        run: |
          echo "✅ Salesforce pipeline completed successfully" >> $GITHUB_STEP_SUMMARY