name: Salesforce CI Engine

on:
  workflow_call:
    inputs:
      deploy_mode:
        required: true
        type: string
      run_pmd:
        required: true
        type: boolean
      environment_name:
        required: true
        type: string
      specified_tests:
        required: false
        type: string

jobs:
  salesforcePipeline:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    environment:
      name: ${{ inputs.environment_name }}

    env:
      # Salesforce CLI & general pipeline vars
      SFDX_URL: ${{ secrets.SFDX_URL }}
      API_VERSION: ${{ vars.API_VERSION }}
      FROM_TAG: ${{ vars.FROM_TAG }}
      TO_TAG: ${{ vars.TO_TAG }}
      SANDBOX_NAME: ${{ vars.SANDBOX_NAME }}
      RUNAGAINSTORG: ${{ vars.RUNAGAINSTORG }}
      UNITTESTS_SCOPE: ${{ vars.UNITTESTS_SCOPE }}
      SPECIFIEDTESTS: ${{ inputs.specified_tests || vars.SPECIFIEDTESTS || '' }}
      SF_CLI_URL: ${{ vars.SF_CLI_URL }}
      INSTANCE_URL: ${{ vars.INSTANCE_URL }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cache Salesforce CLI plugins
      - name: Cache Salesforce plugins
        uses: actions/cache@v4
        with:
          path: ~/.sf
          key: sf-cli-${{ runner.os }}

      # Install Salesforce CLI
      - name: Install Salesforce CLI
        run: |
          set -e
          echo "📥 Downloading Salesforce CLI from $SF_CLI_URL..."
          mkdir -p ~/cli/sf
          curl -sL "$SF_CLI_URL" | tar xzC ~/cli/sf --strip-components 1
          echo "$HOME/cli/sf/bin" >> $GITHUB_PATH
          echo "✅ Salesforce CLI installed successfully"

      - name: Verify Salesforce CLI
        run: sf --version

      # Install sfdx-git-delta plugin
      - name: Install sfdx-git-delta
        run: |
          echo y | sf plugins:install sfdx-git-delta
          sf plugins

      # Create Delta files
      - name: Create Delta files
        run: bash scripts/pipelines/CreateDeltaFiles.sh

      # Setup PMD
      - name: Setup PMD
        if: inputs.run_pmd == true
        uses: legetz/setup-pmd@7.0.0-rc4

      # Run PMD scan
      - name: Apex changes scan
        if: inputs.run_pmd == true && hashFiles('changedSources/force-app/main/default/classes/**/*.cls') != ''
        id: Codescan
        run: |
          mkdir -p pmdResults
          echo "🔍 Running PMD scan on Apex classes..."
          set +e
          pmd check \
            --dir changedSources/force-app/main/default/classes \
            --rulesets ./pmd-rules.xml \
            --format text \
            --report-file ./pmdResults/PmdResults.txt
          PMD_EXIT_CODE=$?
          set -e
          if [[ -s ./pmdResults/PmdResults.txt ]]; then
            cat ./pmdResults/PmdResults.txt
            exit $PMD_EXIT_CODE
          else
            echo "✅ No PMD violations found"

      - name: Upload PMD artifact
        if: failure() && steps.Codescan.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: Pmd-Scan-Report
          path: ./pmdResults/PmdResults.txt

      - name: Report PMD failure
        if: failure() && steps.Codescan.outcome == 'failure'
        run: echo "❌ Apex classes failed PMD scan" >> $GITHUB_STEP_SUMMARY

      - name: No Apex code scan
        if: inputs.run_pmd == true && hashFiles('changedSources/force-app/main/default/classes/**/*.cls') == ''
        run: echo "ℹ️ No Apex class changes identified — PMD scan not run" >> $GITHUB_STEP_SUMMARY

      # Authorize Org using JWT (AES-encrypted key)
      - name: Authorize Org
        shell: bash
        env:
          AESKEY: ${{ secrets.AESKEY }}
          IVKEY: ${{ secrets.IVKEY }}
          ENCRIPTED_KEY: ${{ secrets.ENCRIPTED_KEY }}
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          USER_NAME: ${{ secrets.USER_NAME }}
          SANDBOX_NAME: ${{ vars.SANDBOX_NAME }}
          RUNAGAINSTORG: ${{ vars.RUNAGAINSTORG }}
          INSTANCE_URL: ${{ vars.INSTANCE_URL }}
        run: |
          set -e

          echo "🔐 Authorizing org $SANDBOX_NAME..."
          # Debug lengths (safe)
          echo "AESKEY length: ${#AESKEY}"
          echo "IVKEY length: ${#IVKEY}"
          echo "ENCRIPTED_KEY length: ${#ENCRIPTED_KEY}"
          echo "CONSUMER_KEY length: ${#CONSUMER_KEY}"
          echo "USER_NAME length: ${#USER_NAME}"

          if [[ "$RUNAGAINSTORG" == "false" ]]; then
            echo "ℹ️ RUNAGAINSTORG=false, skipping org authorization"
            exit 0
          fi

          # Decrypt JWT key
          echo "$ENCRIPTED_KEY" > encrypted_key.txt
          openssl enc -aes-256-cbc -md sha1 -nosalt -base64 -d \
            -in encrypted_key.txt \
            -out server.key \
            -K "$AESKEY" \
            -iv "$IVKEY"

          # Authorize org
          sf org login jwt \
            -o "$USER_NAME" \
            -f server.key \
            -i "$CONSUMER_KEY" \
            -r "$INSTANCE_URL" \
            -s \
            -a "$SANDBOX_NAME"

          echo "✅ Successfully authorized org: $SANDBOX_NAME"

          # Cleanup sensitive files
          rm -f server.key encrypted_key.txt

      # Deploy or Validate
      - name: Deploy or Validate
        run: bash scripts/pipelines/DeployOrValidateToOrg.sh ${{ inputs.deploy_mode }}

      # Success summary
      - name: Success summary
        run: echo "✅ Salesforce pipeline completed successfully" >> $GITHUB_STEP_SUMMARY